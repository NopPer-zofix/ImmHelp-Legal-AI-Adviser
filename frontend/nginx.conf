# Serves the built frontend and forwards /api/* to the Flask container.

upstream backend_api {
    server backend:5000;   # service name from docker-compose.yml
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /api/ask → /ask on Flask. The trailing slash in proxy_pass strips the /api prefix;
    # nginx re-encodes the path, so document names with spaces or Greek letters still work.
    location /api/ {
        proxy_pass http://backend_api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /ask waits for the model; gunicorn allows 180 s
        proxy_read_timeout 190s;
        client_max_body_size 2m;
    }

    # Vite puts a hash in every asset name, so they can be cached for good
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the single-page app
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
